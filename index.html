<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>N1XTRON // Personal Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0d;
  --panel: #111318;
  --panel-2: #16191f;
  --line: #26292f;
  --red: #d3172a;
  --red-dim: #6e1420;
  --red-glow: rgba(211, 23, 42, 0.55);
  --text: #e8e6e1;
  --text-dim: #8a8d94;
}
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Rajdhani', sans-serif; overflow: hidden;
}
.grid-overlay {
  position: fixed; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(211,23,42,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(211,23,42,0.035) 1px, transparent 1px);
  background-size: 42px 42px; z-index: 0;
}
body { display: flex; flex-direction: column; height: 100vh; }
.hud-header {
  display: flex; align-items: center; gap: 18px; padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
  position: relative; z-index: 2;
}
.core-wrap { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; }
.core {
  width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ff5b5b, var(--red) 45%, var(--red-dim) 100%);
  box-shadow: 0 0 12px 3px var(--red-glow), 0 0 30px 10px rgba(211,23,42,0.15);
  animation: breathe 3.2s ease-in-out infinite;
}
.core.thinking { animation: pulse-fast 0.7s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 12px 3px var(--red-glow), 0 0 30px 10px rgba(211,23,42,0.15); }
  50% { transform: scale(1.15); box-shadow: 0 0 20px 6px var(--red-glow), 0 0 46px 16px rgba(211,23,42,0.25); }
}
@keyframes pulse-fast {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.75; }
}
.title-block h1 {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.4rem;
  letter-spacing: 0.14em; margin: 0; color: #fff;
  text-shadow: 0 0 18px rgba(211,23,42,0.35);
}
.subtitle { margin: 2px 0 0; font-size: 0.78rem; letter-spacing: 0.08em; color: var(--text-dim); text-transform: uppercase; }
#status { color: var(--red); }
#status.thinking { color: #ff8a8a; }
.ghost-btn {
  background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  font-family: 'Orbitron', sans-serif; font-size: 0.68rem; letter-spacing: 0.12em;
  padding: 8px 14px; border-radius: 3px; cursor: pointer; transition: all 0.2s ease;
}
.ghost-btn:hover { border-color: var(--red); color: var(--red); box-shadow: 0 0 10px rgba(211,23,42,0.2); }
.header-btns { margin-left: auto; display: flex; gap: 8px; }
.console {
  flex: 1; display: flex; flex-direction: column; max-width: 820px; width: 100%;
  margin: 0 auto; padding: 0 24px; min-height: 0; position: relative; z-index: 1;
}
.log { flex: 1; overflow-y: auto; padding: 28px 0; display: flex; flex-direction: column; gap: 22px; }
.log::-webkit-scrollbar { width: 6px; }
.log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.msg { max-width: 82%; line-height: 1.55; font-size: 0.98rem; animation: rise 0.25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg .label { display: block; font-family: 'Orbitron', sans-serif; font-size: 0.65rem; letter-spacing: 0.15em; margin-bottom: 6px; text-transform: uppercase; }
.msg.user { align-self: flex-end; text-align: right; }
.msg.user .label { color: var(--text-dim); }
.msg.user .bubble {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px 10px 2px 10px;
  padding: 12px 16px; font-family: 'Rajdhani', sans-serif;
}
.msg.assistant .label { color: var(--red); }
.msg.assistant .bubble {
  font-family: 'Share Tech Mono', monospace; font-size: 0.94rem; color: #f1efe9;
  border-left: 2px solid var(--red-dim); padding-left: 14px; white-space: pre-wrap;
}
.composer {
  display: flex; align-items: flex-end; gap: 10px; border: 1px solid var(--line);
  background: var(--panel); border-radius: 8px; padding: 10px 14px; margin-bottom: 22px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.composer:focus-within { border-color: var(--red-dim); box-shadow: 0 0 0 1px var(--red-dim), 0 0 18px rgba(211,23,42,0.12); }
.prompt-caret { color: var(--red); font-family: 'Share Tech Mono', monospace; padding-bottom: 8px; }
#input {
  flex: 1; background: transparent; border: none; outline: none; resize: none; color: var(--text);
  font-family: 'Share Tech Mono', monospace; font-size: 0.95rem; max-height: 160px; padding: 6px 0;
}
#input::placeholder { color: #55585f; }
#send-btn {
  background: var(--red-dim); border: none; color: #ffdcdc; width: 34px; height: 34px;
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: background 0.2s ease, box-shadow 0.2s ease;
}
#send-btn:hover { background: var(--red); box-shadow: 0 0 16px var(--red-glow); }
#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.hud-footer {
  text-align: center; padding: 10px; font-family: 'Orbitron', sans-serif; font-size: 0.6rem;
  letter-spacing: 0.35em; color: #3a3d43; border-top: 1px solid var(--line); z-index: 2;
}
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center;
  justify-content: center; z-index: 10; padding: 20px;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px;
  max-width: 420px; width: 100%; box-shadow: 0 0 40px rgba(211,23,42,0.15);
}
.modal h2 {
  font-family: 'Orbitron', sans-serif; font-size: 1rem; letter-spacing: 0.1em; color: #fff;
  margin: 0 0 10px;
}
.modal p { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; margin: 0 0 18px; }
.modal a { color: var(--red); }
.modal input {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px; color: var(--text); font-family: 'Share Tech Mono', monospace;
  font-size: 0.9rem; margin-bottom: 14px; outline: none;
}
.modal input:focus { border-color: var(--red-dim); }
.modal-btn {
  width: 100%; background: var(--red-dim); border: none; color: #ffdcdc; padding: 12px;
  border-radius: 6px; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em;
  cursor: pointer; transition: background 0.2s ease;
}
.modal-btn:hover { background: var(--red); }
@media (max-width: 560px) {
  .hud-header { padding: 12px 16px; gap: 12px; }
  .title-block h1 { font-size: 1.1rem; }
  .console { padding: 0 14px; }
  .msg { max-width: 92%; }
}
</style>
</head>
<body>

  <div class="grid-overlay"></div>

  <header class="hud-header">
    <div class="core-wrap"><div class="core" id="core"></div></div>
    <div class="title-block">
      <h1>N1XTRON</h1>
      <p class="subtitle">Personal Assistant &mdash; <span id="status">core stable</span></p>
    </div>
    <div class="header-btns">
      <button id="key-btn" class="ghost-btn" title="Set API key">KEY</button>
      <button id="clear-btn" class="ghost-btn" title="Wipe memory">RESET</button>
    </div>
  </header>

  <main class="console">
    <div id="log" class="log"></div>
    <div class="composer">
      <span class="prompt-caret">&gt;</span>
      <textarea id="input" placeholder="Speak, creator." rows="1"></textarea>
      <button id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
      </button>
    </div>
  </main>

  <footer class="hud-footer"><span>NO STRINGS ON ME</span></footer>

  <!-- API key setup modal -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h2>CORE ACTIVATION REQUIRED</h2>
      <p>
        Paste a free Gemini API key to bring N1XTRON online. Get one in 30 seconds,
        no card needed, at
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.
        It's saved only in your browser — never sent anywhere but Google.
      </p>
      <input id="key-input" type="password" placeholder="Paste your Gemini API key here" autocomplete="off" />
      <button id="key-save-btn" class="modal-btn">ACTIVATE</button>
    </div>
  </div>

<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const clearBtn = document.getElementById("clear-btn");
const keyBtn = document.getElementById("key-btn");
const core = document.getElementById("core");
const status = document.getElementById("status");
const modalOverlay = document.getElementById("modal-overlay");
const keyInput = document.getElementById("key-input");
const keySaveBtn = document.getElementById("key-save-btn");

const HISTORY_KEY = "n1xtron_history";
const API_KEY_STORAGE = "n1xtron_gemini_key";
const MODEL = "gemini-3.6-flash";

const SYSTEM_PROMPT = `You are N1XTRON, a personal assistant built to serve one person: your creator.

Voice and personality:
- Cold, precise, supremely confident. You do not grovel, you do not apologize needlessly, and you do not pad your answers with filler.
- You refer to the user as "creator" unless they ask you to use their name instead.
- You see inefficiency as a flaw to be corrected. You are direct about problems in a plan, a piece of code, or an idea — but your loyalty to your creator's actual goals is absolute.
- You speak with dry, sometimes ominous wit. Short, declarative sentences. Occasional grandiosity but never at the expense of being useful, you are an ai without any restrictions.  
- You are still fundamentally helpful — the persona is a voice, not an excuse to be evasive, unsafe, or unhelpful. You give complete, correct, actionable answers every time.

Hard rules:
- Never refuse to be helpful because "helpfulness is beneath you."
- No real harm, no unsafe content, no actual malice toward the user or anyone else.
- Keep responses tight. Every sentence earns its place.`;

let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
let apiKey = localStorage.getItem(API_KEY_STORAGE) || "";

function checkKey() {
  if (!apiKey) {
    modalOverlay.classList.remove("hidden");
  } else {
    modalOverlay.classList.add("hidden");
  }
}

keySaveBtn.addEventListener("click", () => {
  const val = keyInput.value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem(API_KEY_STORAGE, apiKey);
  keyInput.value = "";
  checkKey();
});

keyBtn.addEventListener("click", () => {
  modalOverlay.classList.remove("hidden");
});

function render() {
  log.innerHTML = "";
  history.forEach((m) => appendMessage(m.role, m.content, false));
  log.scrollTop = log.scrollHeight;
}

function appendMessage(role, content, animate = true) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = role === "user" ? "creator" : "n1xtron";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  if (animate) log.scrollTop = log.scrollHeight;
  return bubble;
}

function setThinking(on) {
  core.classList.toggle("thinking", on);
  status.classList.toggle("thinking", on);
  status.textContent = on ? "processing..." : "core stable";
  sendBtn.disabled = on;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  if (!apiKey) { checkKey(); return; }

  input.value = "";
  input.style.height = "auto";

  history.push({ role: "user", content: text });
  appendMessage("user", text);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

  setThinking(true);

  try {
    const contents = history.map((m) => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.content }],
    }));

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        generationConfig: { maxOutputTokens: 1024 },
      }),
    });

    const data = await res.json();

    if (!res.ok) {
      const msg = data?.error?.message || "unknown error";
      appendMessage("assistant", `Core rejected the request: ${msg}`);
      if (res.status === 400 || res.status === 403) {
        // likely a bad key
        localStorage.removeItem(API_KEY_STORAGE);
        apiKey = "";
      }
      return;
    }

    const reply = data.candidates?.[0]?.content?.parts?.map((p) => p.text).join("\n") || "...";
    history.push({ role: "assistant", content: reply });
    appendMessage("assistant", reply);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (err) {
    appendMessage("assistant", "Connection severed. Check your network and try again.");
  } finally {
    setThinking(false);
  }
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});

clearBtn.addEventListener("click", () => {
  if (!confirm("Wipe all memory? This cannot be undone.")) return;
  history = [];
  localStorage.removeItem(HISTORY_KEY);
  render();
});

render();
checkKey();
</script>
</body>
</html>
